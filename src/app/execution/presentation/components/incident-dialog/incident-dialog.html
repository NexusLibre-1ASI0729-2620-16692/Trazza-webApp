<h2 mat-dialog-title>
  Reportar incidencia
</h2>

<mat-dialog-content>

  <div class="incident-dialog__form">

    <mat-form-field appearance="outline">
      <mat-label>Tipo de incidencia</mat-label>

      <mat-select [(ngModel)]="selectedType">

        @for (incidentType of incidentTypes; track incidentType.value) {
          <mat-option [value]="incidentType.value">
            {{ incidentType.label }}
          </mat-option>
        }

      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>¿Qué ocurrió?</mat-label>

      <textarea
        matInput
        [(ngModel)]="description"
        rows="6"
        maxlength="500"
        placeholder="Describe brevemente lo ocurrido...">
      </textarea>

      <mat-hint align="end">
        {{ description.length }}/500
      </mat-hint>

    </mat-form-field>

    @if (
      description.length > 0 &&
      description.trim().length < 10
      ) {
      <p class="incident-dialog__validation">
        La descripción debe tener al menos 10 caracteres.
      </p>
    }

  </div>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-button
    type="button"
    (click)="cancel()">
    Cancelar
  </button>

  <button
    mat-flat-button
    type="button"
    [disabled]="!isValid"
    (click)="submit()">
    Reportar incidencia
  </button>

</mat-dialog-actions>
