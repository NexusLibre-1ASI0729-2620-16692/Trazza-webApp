@if (readonly()) {
  <span class="stars" role="img" [attr.aria-label]="'rating.of-five' | translate: { score: value() }">
    @for (star of stars; track star) {
      <mat-icon class="star" [class.filled]="star <= value()" aria-hidden="true">{{ star <= value() ? 'star' : 'star_border' }}</mat-icon>
    }
  </span>
} @else {
  <span class="stars" role="radiogroup" [attr.aria-label]="'rating.score' | translate" tabindex="0" (keydown)="onKeydown($event)">
    @for (star of stars; track star) {
      <button type="button" class="star-button" role="radio" [attr.aria-checked]="star === value()"
              [attr.aria-label]="'rating.of-five' | translate: { score: star }" tabindex="-1" (click)="select(star)">
        <mat-icon class="star" [class.filled]="star <= value()" aria-hidden="true">{{ star <= value() ? 'star' : 'star_border' }}</mat-icon>
      </button>
    }
  </span>
}
