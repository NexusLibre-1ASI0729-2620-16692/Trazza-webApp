<div class="counter-offer">
  @if (titleKey()) {
    <div class="semibold mb-1">{{ titleKey() | translate: titleParams() }}</div>
  }
  @if (hintKey()) {
    <div class="text-sm trazza-muted mb-2">{{ hintKey() | translate: hintParams() }}</div>
  }
  <div class="counter-row">
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="counter-field">
      <mat-label>{{ 'offer.your-rate' | translate }}</mat-label>
      <span matTextPrefix>S/&nbsp;</span>
      <input matInput [id]="fieldId()" type="number" min="1" step="0.5" [value]="amount() ?? ''" (input)="updateAmount($event)">
    </mat-form-field>
    <button mat-flat-button type="button" [disabled]="loading() || !amount()" (click)="submit()">
      <mat-icon>send</mat-icon>{{ 'actions.send' | translate }}
    </button>
  </div>
</div>
