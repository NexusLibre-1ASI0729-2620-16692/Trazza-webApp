<h2 mat-dialog-title>{{ data.titleKey | translate }}</h2>
<mat-dialog-content>
  <p>{{ data.messageKey | translate: (data.params ?? {}) }}</p>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>{{ 'offer.your-rate' | translate }}</mat-label>
    <span matTextPrefix>S/&nbsp;</span>
    <input matInput id="offer-amount" type="number" min="1" step="0.5" [value]="amount() ?? ''" (input)="updateAmount($event)" cdkFocusInitial>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>{{ 'actions.cancel' | translate }}</button>
  <button mat-flat-button type="button" [disabled]="!amount()" (click)="confirm()"><mat-icon>send</mat-icon>{{ 'actions.send' | translate }}</button>
</mat-dialog-actions>
